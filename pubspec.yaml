  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo/logo_2.png
  image_path_android: assets/images/logo/logo_2.png
  image_path_ios: assets/images/logo/logo.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo/logo_2.png
  adaptive_icon_monochrome: assets/images/logo/logo_2.png
  macos:
    generate: true
    image_path: assets/images/logo/logo.png

flutter_native_splash:
  android_12:
    color: "#ffffff"
    color_dark: "#212121"
  color: "#ffffff"
  color_dark: "#212121"
  image: assets/images/logo/logo_2.png
  image_dark: assets/images/logo/logo_2.png

flutter:
  uses-material-design: true

  assets:
    - path: assets/images/
    - path: assets/images/logo/
    - path: assets/images/logo/ico/
      platforms: [windows]
    - path: assets/images/logo/desktop/
      platforms: [linux, macos]
    - path: assets/images/live/
    - path: assets/images/paycoins/
    - path: assets/shaders/
    # BudouX's Japanese phrase model: where a Japanese subtitle may break
    - packages/budoux_dart/models/ja.json
    # OpenCC's s2twp dictionaries: Traditional Chinese subtitles
    - assets/opencc/STPhrases.txt
    - assets/opencc/STPhrases_GeneratedFromRegionalPhrases.txt
    - assets/opencc/STCharacters.txt
    - assets/opencc/TWPhrases.txt
    - assets/opencc/TWVariantsPhrases.txt
    - assets/opencc/TWVariants.txt
    - assets/opencc/CJK_Compatibility_Ideographs.txt

  fonts:
    - family: digital_id_num
      fonts:
        - asset: assets/fonts/digital_id_num.ttf
    - family: custom_icon
      fonts:
        - asset: assets/fonts/custom_icon.ttf

# LibrePili: llamadart's build hook downloads its native runtimes (checksum
# pinned in the package). Only llama.cpp on the CPU: LiteRT-LM was measured
# and not adopted (research/litert-lm-probe-2026-09-23.md), and bundling it
# anyway adds about 130 MB to an Android build; Vulkan is untested on the
# target phones.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: llama_cpp
      # per platform or it is ignored: a bare value selects nothing
      llamadart_native_backends:
        platforms:
          android: [cpu]
          windows: [cpu]
          linux: [cpu]
          macos: [cpu]
