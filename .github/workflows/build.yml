name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            android_dev:
                description: "Android as the test build (com.zxa24.librepili.dev, installs alongside the normal one)"
                required: false
                default: false
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write # publishing the release only

        steps:
            - name: 代码迁出
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              # via env, not inline interpolation: a password containing a
              # quote would otherwise break (or escape) the shell command
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
                    # all four are needed: a half-configured keystore would
                    # fail at signing time, or (worse) fall back to the debug key
                    if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
                      echo "::error::SIGN_KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is empty"
                      exit 1
                    fi
                    printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                    {
                      echo "storeFile=key.jks"
                      echo "storePassword=$KEYSTORE_PASSWORD"
                      echo "keyAlias=$KEY_ALIAS"
                      echo "keyPassword=$KEY_PASSWORD"
                    } >> android/key.properties
                  elif [ -n "$TAG" ]; then
                    # a tagged release signed with the runner's throwaway debug
                    # key cannot update installed builds (users would have to
                    # uninstall and lose local follows / favorites)
                    echo "::error::SIGN_KEYSTORE_BASE64 is not set: refusing to build a tagged release"
                    exit 1
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub ${{ github.event.inputs.android_dev == 'true' && '--android-project-arg=dev=true' || '' }}

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "LibrePili_android_${{ env.version }}${{ github.event.inputs.android_dev == 'true' && '_dev' || '' }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: LibrePili_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: LibrePili_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: LibrePili_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: LibrePili_android_*_x86_64.apk

    ios:
        if: ${{ github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
