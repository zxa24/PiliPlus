name: Build

on:
    # pull_request:
    #     types:
    #         - opened
    #         - synchronize
    #         - reopened
    #         - ready_for_review
    #     paths-ignore:
    #         - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            android_dev:
                description: "Android as the test build (com.zxa24.librepili.dev, installs alongside the normal one)"
                required: false
                default: false
                type: boolean

            # LibrePili: the watch-page test builds (design feature-logs/
            # watch-page-shell/design.md §6.3 「从不卸载」): every APK compared on
            # the phone has the same versionCode, so `adb install -r` swaps
            # them without a downgrade. Empty = today's versionCode
            # (git rev-list --count, lib/scripts/build.ps1). Android only, and
            # refused together with a tag: a release keeps its own number.
            build_number:
                description: "Android versionCode to build with (digits; empty = commit count). Test builds only, not with a tag"
                required: false
                default: ""
                type: string

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    # LibrePili: the inputs checked before any job starts (every job needs
    # it): a refused build_number stops the whole run, desktop releases of a
    # tag included
    check_inputs:
        name: Check inputs
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Check build number
              env:
                  BUILD_NUMBER: ${{ github.event.inputs.build_number }}
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  if [ -z "$BUILD_NUMBER" ]; then
                    echo "no build_number: versionCode from the commit count"
                    exit 0
                  fi
                  # Android's versionCode is at most 2100000000
                  if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[1-9][0-9]{0,9}$' || [ "$BUILD_NUMBER" -gt 2100000000 ]; then
                    echo "::error::build_number must be a whole number from 1 to 2100000000, not '$BUILD_NUMBER'"
                    exit 1
                  fi
                  if [ -n "$TAG" ]; then
                    echo "::error::build_number is for test builds: refusing it together with tag '$TAG'"
                    exit 1
                  fi
                  echo "build_number $BUILD_NUMBER accepted"

    android:
        needs: check_inputs
        if: ${{ github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write # publishing the release only

        steps:
            - name: 代码迁出
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              # via env, not inline interpolation: a password containing a
              # quote would otherwise break (or escape) the shell command
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  TAG: ${{ github.event.inputs.tag }}
              run: |
                  if [ -n "$SIGN_KEYSTORE_BASE64" ]; then
                    # all four are needed: a half-configured keystore would
                    # fail at signing time, or (worse) fall back to the debug key
                    if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
                      echo "::error::SIGN_KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD is empty"
                      exit 1
                    fi
                    printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                    {
                      echo "storeFile=key.jks"
                      echo "storePassword=$KEYSTORE_PASSWORD"
                      echo "keyAlias=$KEY_ALIAS"
                      echo "keyPassword=$KEY_PASSWORD"
                    } >> android/key.properties
                  elif [ -n "$TAG" ]; then
                    # a tagged release signed with the runner's throwaway debug
                    # key cannot update installed builds (users would have to
                    # uninstall and lose local follows / favorites)
                    echo "::error::SIGN_KEYSTORE_BASE64 is not set: refusing to build a tagged release"
                    exit 1
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Show build number
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_number != '' }}
              env:
                  BUILD_NUMBER: ${{ github.event.inputs.build_number }}
              # checked by the check_inputs job this one needs
              run: echo "versionCode fixed at $BUILD_NUMBER (the commit count would be $(git rev-list --count HEAD))"

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub ${{ github.event.inputs.android_dev == 'true' && '--android-project-arg=dev=true' || '' }} ${{ github.event.inputs.build_number != '' && format('--build-number={0}', github.event.inputs.build_number) || '' }}

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "LibrePili_android_${{ env.version }}${{ github.event.inputs.android_dev == 'true' && '_dev' || '' }}${{ github.event.inputs.build_number != '' && format('_vc{0}', github.event.inputs.build_number) || '' }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: LibrePili_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: LibrePili_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: LibrePili_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: LibrePili_android_*_x86_64.apk

    ios:
        needs: check_inputs
        if: ${{ github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        needs: check_inputs
        if: ${{ github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        needs: check_inputs
        if: ${{ github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        needs: check_inputs
        if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions:
            contents: write # publishing the release only
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
