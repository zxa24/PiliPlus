name: Build for Linux x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-linux-app:
    name: Release Linux x64
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishing the release only
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb
        shell: bash

      - name: Setup flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

        #TODO: deb and rpm packages need to be build
      - name: Build Linux
        run: flutter build linux --release --dart-define-from-file=pili_release.json --no-pub

      # the built app started for real under a virtual display, offline
      # checks only (see SelfTest.ciSmokeFlags); a failure stops the job
      # before anything is packaged or released
      - name: Self-test
        timeout-minutes: 15
        shell: pwsh
        run: lib/scripts/selftest_ci.ps1 -Exe xvfb-run -LauncherArgs '-a','-s','-screen 0 1600x900x24','build/linux/x64/release/bundle/librepili' -Out selftest-linux.json

      - name: Upload self-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: selftest-linux
          path: selftest-linux.json
          if-no-files-found: warn

      - name: Package .tar.gz
        run: tar -zcvf LibrePili_linux_${{ env.version }}_amd64.tar.gz -C build/linux/x64/release/bundle .

      - name: Packege deb
        run: |
          printf "建立构建目录...\n"
          mkdir "LibrePili_linux_${{ env.version }}_amd64"
          pushd "LibrePili_linux_${{ env.version }}_amd64"
          mkdir -p opt/LibrePili
          mkdir -p usr/share/applications
          mkdir -p usr/share/icons/hicolor/512x512/apps

          printf "复制文件...\n"
          cp -r ../build/linux/x64/release/bundle/* opt/LibrePili
          cp -r ../assets/linux/DEBIAN .
          cp ../assets/linux/com.zxa24.librepili.desktop usr/share/applications
          cp ../assets/images/logo/logo.png usr/share/icons/hicolor/512x512/apps/librepili.png

          printf "修改控制文件...\n"
          # 替换版本号
          sed -i  "2s/version_need_change/${{ env.version }}/g" DEBIAN/control
          # 计算安装大小并替换
          SIZE_KB=$(du -s -b --apparent-size . | awk '{print int($1)}')
          SIZE_KB=$(($SIZE_KB - $(du -s -b --apparent-size DEBIAN | awk '{print int($1)}')))
          SIZE_KB=$(echo $SIZE_KB | awk '{print int($1/1024 + 0.999)}')
          printf "\t安装大小: %s KB\n" "$SIZE_KB"
          sed -i "9s/size_need_change/${SIZE_KB}/g" DEBIAN/control

          printf "生成并写入 md5sums ...\n"
          md5sum opt/LibrePili/librepili >> DEBIAN/md5sums
          md5sum opt/LibrePili/lib/* >> DEBIAN/md5sums
          md5sum opt/LibrePili/data/icudtl.dat >> DEBIAN/md5sums

          printf "设置权限...\n"
          chmod 0644 DEBIAN/control
          chmod 0644 DEBIAN/md5sums
          chmod 0755 DEBIAN/postinst
          chmod 0755 DEBIAN/postrm
          chmod 0755 DEBIAN/prerm

          printf "打包 deb 文件...\n"
          popd
          dpkg-deb --build --verbose --root-owner-group "LibrePili_linux_${{ env.version }}_amd64"
          printf "完成: LibrePili_linux_%s_amd64.deb\n" "${{ env.version }}"
        shell: bash

      - name: Packege rpm
        run: |
          printf "建立 RPM 构建目录...\n"
          RPM_BUILD_ROOT="$PWD/rpm_build"
          mkdir -p "$RPM_BUILD_ROOT/BUILD" "$RPM_BUILD_ROOT/RPMS" "$RPM_BUILD_ROOT/SOURCES" "$RPM_BUILD_ROOT/SPECS" "$RPM_BUILD_ROOT/SRPMS"

          printf "准备源码归档（仅包含运行时与元数据）...\n"
          DATE="$(date '+%a %b %d %Y')"
          SRC_DIR="$PWD/librepili-${{ env.version }}"
          mkdir -p "$SRC_DIR/bundle" "$SRC_DIR/assets"
          cp -r build/linux/x64/release/bundle/* "$SRC_DIR/bundle/"
          cp assets/linux/com.zxa24.librepili.desktop "$SRC_DIR/assets/com.zxa24.librepili.desktop"
          cp assets/images/logo/logo.png "$SRC_DIR/assets/librepili.png"
          tar -zcvf "$RPM_BUILD_ROOT/SOURCES/librepili-${{ env.version }}.tar.gz" -C "$PWD" "librepili-${{ env.version }}"

          printf "生成 spec 文件...\n"
          cat > "$RPM_BUILD_ROOT/SPECS/librepili.spec" <<EOF
          Name:           librepili
          Version:        ${{ env.version }}
          Release:        1%{?dist}
          Summary:        LibrePili Linux Version
          License:        GPL-3.0
          Source0:        librepili-${{ env.version }}.tar.gz
          Requires:       desktop-file-utils, hicolor-icon-theme

          %description
          使用 Flutter 开发的 BiliBili 第三方客户端

          %prep
          %setup -q -n librepili-${{ env.version }}

          %build

          %install
          mkdir -p %{buildroot}/opt/LibrePili
          cp -r bundle/* %{buildroot}/opt/LibrePili/

          # 二进制权限与命令行入口
          chmod 755 %{buildroot}/opt/LibrePili/librepili
          mkdir -p %{buildroot}/usr/bin
          ln -sf /opt/LibrePili/librepili %{buildroot}/usr/bin/librepili

          # 桌面集成
          mkdir -p %{buildroot}/usr/share/applications
          install -m 644 assets/com.zxa24.librepili.desktop %{buildroot}/usr/share/applications/com.zxa24.librepili.desktop

          mkdir -p %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m 644 assets/librepili.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/librepili.png

          %post
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %postun
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %files
          /opt/LibrePili
          /usr/bin/librepili
          /usr/share/applications/com.zxa24.librepili.desktop
          /usr/share/icons/hicolor/512x512/apps/librepili.png

          %changelog
          * DATE - ${{ env.version }}-1
          - Initial RPM release
          EOF

          sed -i "s/DATE/${DATE}/g" "$RPM_BUILD_ROOT/SPECS/librepili.spec"

          printf "构建 RPM 包...\n"
          rpmbuild --define "_topdir $RPM_BUILD_ROOT" -bb "$RPM_BUILD_ROOT/SPECS/librepili.spec"

          printf "移动生成的 RPM...\n"
          find "$RPM_BUILD_ROOT/RPMS" -name "*.rpm" -exec mv {} "LibrePili_linux_${{ env.version }}_amd64.rpm" \;

          printf "完成: LibrePili_linux_%s_amd64.rpm\n" "${{ env.version }}"
        shell: bash

      - name: Package AppImage
        run: |
          printf "下载 appimagetool...\n"
          # a fixed release, checked against its sha256 (not the moving
          # `continuous` tag)
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage

          printf "建立 AppDir 目录结构...\n"
          APPDIR="LibrePili.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          printf "复制应用文件...\n"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"

          printf "复制桌面文件和图标...\n"
          cp assets/linux/com.zxa24.librepili.desktop "$APPDIR/com.zxa24.librepili.desktop"
          cp assets/linux/com.zxa24.librepili.desktop "$APPDIR/usr/share/applications/com.zxa24.librepili.desktop"
          cp assets/images/logo/logo.png "$APPDIR/librepili.png"
          cp assets/images/logo/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/librepili.png"

          printf "创建 AppRun 启动脚本...\n"
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/librepili" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"

          printf "打包 AppImage...\n"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "LibrePili_linux_${{ env.version }}_amd64.AppImage"

          printf "完成: LibrePili_linux_%s_amd64.AppImage\n" "${{ env.version }}"
        shell: bash

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            LibrePili_linux_*.tar.gz
            LibrePili_linux_*.deb
            LibrePili_linux_*.rpm
            LibrePili_linux_*.AppImage

      - name: Upload linux targz package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          name: Linux_targz_amd64_packege
          path: LibrePili_linux_*.tar.gz

      - name: Upload linux deb package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          name: Linux_deb_amd64_package
          path: LibrePili_linux_*.deb

      - name: Upload linux rpm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          name: Linux_rpm_amd64_package
          path: LibrePili_linux_*.rpm

      - name: Upload linux AppImage package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          archive: false
          name: Linux_AppImage_amd64_package
          path: LibrePili_linux_*.AppImage
